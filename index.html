<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>자연의 속도로</title>
  <meta name="description" content="산과 숲, 바다와 호수를 스크롤로 만나는 미니멀 웹페이지" />

  <!-- 폰트: Pretendard CDN 연결 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- 자바스크립트가 켜져 있을 때만 페이드인 초기 상태를 적용 (꺼져 있어도 내용이 보이도록) -->
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>

  <!-- [효과 3] 스크롤 진행률 프로그래스 바 -->
  <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>

  <main>
    <!-- 히어로 -->
    <section class="hero">
      <!-- [효과 2] 패럴랙스가 적용되는 히어로 배경 이미지 -->
      <img
        class="hero-bg"
        id="heroBg"
        src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1920&q=80"
        alt="구름 위로 솟은 산봉우리"
        fetchpriority="high"
      />
      <div class="hero-text">
        <!-- [효과 1] reveal 클래스: 아래에서 위로 페이드인 -->
        <h1 class="reveal">자연의 속도로</h1>
        <p class="reveal delay-1">잠시 화면을 내려 보세요.<br />산과 숲, 바다가 차례로<br />당신을 맞이합니다.</p>
      </div>
    </section>

    <!-- 섹션 1 -->
    <section class="section">
      <div class="section-text">
        <h2 class="reveal">숲의 호흡</h2>
        <p class="reveal delay-1">나무 사이로 빛이 스며듭니다.<br />발걸음은 저절로 느려지고<br />숨은 조금 더 깊어집니다.</p>
      </div>
      <img
        class="section-img reveal delay-2"
        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80"
        alt="햇살이 비치는 초록빛 숲"
        width="1200"
        height="1500"
        loading="lazy"
      />
    </section>

    <!-- 섹션 2 -->
    <section class="section section--reverse">
      <div class="section-text">
        <h2 class="reveal">바다의 리듬</h2>
        <p class="reveal delay-1">파도는 늘 같은 자리로 돌아옵니다.<br />서두르지 않아도 괜찮다고<br />조용히 일러 주면서요.</p>
      </div>
      <img
        class="section-img reveal delay-2"
        src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80"
        alt="파도가 밀려오는 맑은 해변"
        width="1200"
        height="1500"
        loading="lazy"
      />
    </section>

    <!-- 섹션 3 -->
    <section class="section">
      <div class="section-text">
        <h2 class="reveal">호수의 고요</h2>
        <p class="reveal delay-1">바람이 멎으면 물은 하늘이 됩니다.<br />오늘 하루의 끝에도<br />그런 고요가 머물기를.</p>
      </div>
      <img
        class="section-img reveal delay-2"
        src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80"
        alt="산과 하늘이 비치는 잔잔한 호수"
        width="1200"
        height="1500"
        loading="lazy"
      />
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
